<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { MeshoptDecoder } from "three/addons/libs/meshopt_decoder.module.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";

/* ============================================================
   Шоурум GT, Ростов-на-Дону. Схема: зал 20 x 15 м (300 м²), высота 7,2 м,
   антресоль по задней стене 20 x 5,5 м на отметке +3,6.
   Оси: x вдоль улицы (-10..10), z вглубь (+7,5 витрина, -7,5 задняя стена), y вверх. Метры.
   ============================================================ */
const Q = new URLSearchParams(location.search);
const VIEW = Q.get("view") || "hero";
const DPR = +(Q.get("dpr") || 1);
const W = innerWidth, H = innerHeight;

const C = { flare: 0xff4a2b, ink: 0x0e1013, graph: 0x22262d, white: 0xf6f7f8, sky: 0x9cc9ff, cobalt: 0x2a5bd7, ridge: 0xb0283f, frost: 0xeef1f4 };

const renderer = new THREE.WebGLRenderer({ antialias: DPR < 2, preserveDrawingBuffer: true, powerPreference: "high-performance" });
renderer.setPixelRatio(DPR);
renderer.setSize(W, H);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.toneMappingExposure = 1.0;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
// фон: мягкий градиент, его же видно сквозь стекло
{
  const c = document.createElement("canvas"); c.width = 16; c.height = 512;
  const g = c.getContext("2d"); const gr = g.createLinearGradient(0, 0, 0, 512);
  gr.addColorStop(0, "#f7f9fc"); gr.addColorStop(0.55, "#e8edf4"); gr.addColorStop(1, "#d9e0ea");
  g.fillStyle = gr; g.fillRect(0, 0, 16, 512);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; scene.background = t;
}
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.45;

/* ---------- материалы ---------- */
const M = {
  floor: new THREE.MeshPhysicalMaterial({ color: 0xcfd4db, roughness: 0.28, metalness: 0, clearcoat: 0.6, clearcoatRoughness: 0.2 }),
  plinth: new THREE.MeshStandardMaterial({ color: 0x23272e, roughness: 0.55, metalness: 0.1 }),
  slab: new THREE.MeshStandardMaterial({ color: 0xf7f8fa, roughness: 0.55 }),
  white: new THREE.MeshStandardMaterial({ color: 0xf6f7f8, roughness: 0.38 }),
  gloss: new THREE.MeshPhysicalMaterial({ color: 0xffffff, roughness: 0.12, clearcoat: 1, clearcoatRoughness: 0.08 }),
  graph: new THREE.MeshStandardMaterial({ color: C.graph, roughness: 0.5, metalness: 0.2 }),
  steel: new THREE.MeshStandardMaterial({ color: 0x2b3038, roughness: 0.35, metalness: 0.75 }),
  fabric: new THREE.MeshStandardMaterial({ color: 0x3a4049, roughness: 0.9 }),
  wood: new THREE.MeshStandardMaterial({ color: 0xc9a77c, roughness: 0.6 }),
  person: new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.55 }),
  plant: new THREE.MeshStandardMaterial({ color: 0x5f8f62, roughness: 0.8 }),
  glass: new THREE.MeshPhysicalMaterial({ color: 0xdfe9ff, metalness: 0, roughness: 0.05, transmission: 1, thickness: 0.12, ior: 1.45,
    attenuationColor: new THREE.Color(0x8fb2ff), attenuationDistance: 2.0, specularIntensity: 0.8, envMapIntensity: 0.8, side: THREE.DoubleSide }),
  frost: new THREE.MeshPhysicalMaterial({ color: 0xd6e2fa, metalness: 0, roughness: 0.22, transmission: 1, thickness: 0.2, ior: 1.45,
    attenuationColor: new THREE.Color(0x7fa3f0), attenuationDistance: 1.6, envMapIntensity: 0.7, side: THREE.DoubleSide }),
  glow: (c, k = 6) => new THREE.MeshStandardMaterial({ color: c, emissive: c, emissiveIntensity: k, roughness: 0.4 }),
};
const box = (w, h, d, m, x, y, z, r = 0) => {
  const g = r > 0 ? new RoundedBoxGeometry(w, h, d, 3, r) : new THREE.BoxGeometry(w, h, d);
  const o = new THREE.Mesh(g, m); o.position.set(x, y, z); o.castShadow = true; o.receiveShadow = true; return o;
};
const cyl = (r, h, m, x, y, z, seg = 64) => { const o = new THREE.Mesh(new THREE.CylinderGeometry(r, r, h, seg), m); o.position.set(x, y, z); o.castShadow = true; o.receiveShadow = true; return o; };

const world = new THREE.Group(); scene.add(world);
const mezz = new THREE.Group(); world.add(mezz);   // все, что на антресоли (в плане скрываем)
const add = (o, g = world) => { g.add(o); return o; };

/* ---------- основание и пол ---------- */
const MZ = -2.0, FL2 = 3.6; // край антресоли и отметка ее пола
add(box(21.6, 0.5, 16.6, M.plinth, 0, -0.25, 0, 0.18));
add(box(20, 0.02, 15, M.floor, 0, 0.01, 0));
// тонкая сетка на полу, как разметка трека
{
  const grid = new THREE.GridHelper(20, 20, 0xc9d0da, 0xd6dce4); grid.position.y = 0.025; grid.scale.z = 0.75;
  grid.material.transparent = true; grid.material.opacity = 0.45; add(grid);
}

/* ---------- стены: задняя и левая стеклянные на всю высоту, витрина и правая стена в разрезе ---------- */
const HALL = 7.2;
function glassWall(len, h, axis, x, z, m = M.frost, step = 2.5) {
  const g = new THREE.Group();
  const p = new THREE.Mesh(new THREE.BoxGeometry(axis === "x" ? len : 0.06, h, axis === "x" ? 0.06 : len), m);
  p.position.set(x, h / 2, z); g.add(p);
  const n = Math.round(len / step);
  for (let i = 0; i <= n; i++) {
    const t = -len / 2 + (i * len) / n;
    const mu = box(axis === "x" ? 0.07 : 0.09, h, axis === "x" ? 0.09 : 0.07, M.graph, axis === "x" ? x + t : x, h / 2, axis === "x" ? z : z + t);
    g.add(mu);
  }
  const cap = box(axis === "x" ? len + 0.1 : 0.14, 0.1, axis === "x" ? 0.14 : len + 0.1, M.graph, x, h, z); g.add(cap);
  return add(g);
}
const VIEW_PLAN = VIEW === "plan";
glassWall(20, HALL, "x", 0, -7.5);
glassWall(15, HALL, "z", -10, 0);
// витрина и правая стена срезаны на 1,1 м, чтобы заглянуть внутрь
glassWall(20, 1.1, "x", 0, 7.5, M.glass);
glassWall(15, 1.1, "z", 10, 0, M.glass);
// вход: разрыв в витрине обозначим порогом
add(box(2.4, 0.03, 0.5, M.graph, 3.0, 0.03, 7.5));

/* ---------- антресоль ---------- */
add(box(20, 0.22, 5.5, M.slab, 0, FL2 - 0.11, -4.75), mezz);
// подсветка по торцу плиты
add(box(18.4, 0.04, 0.04, M.glow(0xffffff, 2.2), -0.8, FL2 - 0.24, MZ + 0.02), mezz);
// колонны
for (const x of [-6, -1.5, 3, 7.5]) add(cyl(0.09, FL2 - 0.22, M.steel, x, (FL2 - 0.22) / 2, MZ - 0.15, 24), mezz);
// стеклянное ограждение
add(box(18.6, 1.05, 0.04, M.glass, -0.7, FL2 + 0.52, MZ + 0.05), mezz);
add(box(18.6, 0.05, 0.07, M.steel, -0.7, FL2 + 1.06, MZ + 0.05), mezz);

/* ---------- лестница вдоль правой стены ---------- */
{
  const g = new THREE.Group();
  const N = 20, run = 0.27, rise = FL2 / N, z0 = 3.4;
  for (let i = 0; i < N; i++) {
    const s = box(1.25, 0.06, run + 0.02, M.white, 9.3, rise * (i + 1) - 0.03, z0 - run * (i + 0.5));
    g.add(s);
  }
  // косоур и стекло
  const len = Math.hypot(N * run, FL2), ang = Math.atan2(FL2, N * run);
  const st = box(0.08, 0.32, len, M.steel, 8.66, FL2 / 2 - 0.05, z0 - (N * run) / 2); st.rotation.x = ang; g.add(st);
  const gl = box(0.03, 1.0, len, M.glass, 8.66, FL2 / 2 + 0.55, z0 - (N * run) / 2); gl.rotation.x = ang; g.add(gl);
  add(g, mezz);
}

/* ---------- байки ---------- */
const loader = new GLTFLoader(); loader.setMeshoptDecoder(MeshoptDecoder);
const REAL = { base: 1.62, sport: 1.98, pro: 2.14, road: 2.02, roadpro: 2.06 };
const SRC = {};
async function src(v) {
  if (!SRC[v]) SRC[v] = loader.loadAsync(`/public/models/${v}.glb`).then((g) => {
    const s = g.scene; s.updateMatrixWorld(true);
    const b = new THREE.Box3().setFromObject(s, true), sz = b.getSize(new THREE.Vector3());
    if (sz.z > sz.x) s.rotation.y = Math.PI / 2;
    s.updateMatrixWorld(true);
    const b2 = new THREE.Box3().setFromObject(s, true), s2 = b2.getSize(new THREE.Vector3());
    s.scale.multiplyScalar(REAL[v] / Math.max(s2.x, s2.z)); s.updateMatrixWorld(true);
    const b3 = new THREE.Box3().setFromObject(s, true), c = b3.getCenter(new THREE.Vector3());
    s.position.set(-c.x, -b3.min.y, -c.z);
    const w = new THREE.Group(); w.add(s); return w;
  });
  return SRC[v];
}
async function bike(v, paint, x, y, z, ry, g = world, body = null) {
  const o = (await src(v)).clone(true);
  o.traverse((m) => {
    if (!m.isMesh) return; m.castShadow = true; m.receiveShadow = true;
    const one = (mt) => {
      const acc = /^GT_accent/.test(mt.name) || (v === "base" && mt.name === "GT_paint");
      if (paint && acc) { const c = mt.clone(); c.color.set(paint); return c; }
      if (body && mt.name === "GT_paint") { const c = mt.clone(); c.color.set(body); return c; }
      return mt;
    };
    m.material = Array.isArray(m.material) ? m.material.map(one) : one(m.material);
  });
  o.position.set(x, y, z); o.rotation.y = ry; add(o, g); return o;
}

/* ---------- флагман на подиуме у витрины, гало над ним ---------- */
const POD = new THREE.Vector3(-5.4, 0, 4.3);
add(cyl(1.7, 0.24, new THREE.MeshPhysicalMaterial({ color: 0x1b1f25, roughness: 0.2, clearcoat: 1, clearcoatRoughness: 0.1 }), POD.x, 0.12, POD.z));
add(new THREE.Mesh(new THREE.TorusGeometry(1.7, 0.025, 12, 160), M.glow(C.flare, 4))).position.set(POD.x, 0.245, POD.z);
world.children.at(-1).rotation.x = Math.PI / 2;
{
  const halo = new THREE.Mesh(new THREE.TorusGeometry(1.7, 0.045, 20, 200), M.glow(0xfff4ea, 3.2));
  halo.rotation.x = Math.PI / 2; halo.position.set(POD.x, 2.35, POD.z); add(halo);
  for (const a of [0, 2.09, 4.19]) add(cyl(0.006, HALL - 2.35, M.steel, POD.x + Math.cos(a) * 1.7, 2.35 + (HALL - 2.35) / 2, POD.z + Math.sin(a) * 1.7, 6));
  // мягкий световой столб от гало к подиуму: связывает их визуально
  const c = document.createElement("canvas"); c.width = 4; c.height = 256;
  const g = c.getContext("2d"); const gr = g.createLinearGradient(0, 0, 0, 256);
  gr.addColorStop(0, "rgba(255,236,220,0.30)"); gr.addColorStop(0.7, "rgba(255,190,160,0.10)"); gr.addColorStop(1, "rgba(255,120,90,0.0)");
  g.fillStyle = gr; g.fillRect(0, 0, 4, 256);
  const beam = new THREE.Mesh(new THREE.CylinderGeometry(1.68, 1.72, 2.1, 96, 1, true), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(c), transparent: true, depthWrite: false, side: THREE.DoubleSide, blending: THREE.AdditiveBlending, toneMapped: false }));
  beam.position.set(POD.x, 0.24 + 2.1 / 2, POD.z); add(beam);
}

/* ---------- линейка на подиуме-дорожке, свет по сериям ---------- */
const RUN = { x0: -6.2, x1: 6.0, z0: 0.0, z1: 2.3 };
add(box(RUN.x1 - RUN.x0, 0.16, RUN.z1 - RUN.z0, M.white, (RUN.x0 + RUN.x1) / 2, 0.08, (RUN.z0 + RUN.z1) / 2, 0.04));
const LINE = [
  ["base", C.sky, C.sky], ["sport", C.flare, C.flare], ["sport", C.flare, C.flare], ["pro", C.ridge, C.ridge], ["road", C.cobalt, C.cobalt], ["roadpro", C.cobalt, C.cobalt],
];
const step = (RUN.x1 - RUN.x0) / LINE.length;
LINE.forEach(([v, paint, led], i) => {
  const cx = RUN.x0 + step * (i + 0.5);
  add(box(step - 0.18, 0.03, 0.03, M.glow(led, 3), cx, 0.165, RUN.z1 + 0.005));
});

/* ---------- первый байк: круглый подиум для питбайков ---------- */
const KID = new THREE.Vector3(7.3, 0, 0.9);
add(cyl(1.2, 0.14, M.white, KID.x, 0.07, KID.z));
add(new THREE.Mesh(new THREE.TorusGeometry(1.2, 0.02, 10, 120), M.glow(C.sky, 3))).position.set(KID.x, 0.145, KID.z);
world.children.at(-1).rotation.x = Math.PI / 2;

/* ---------- стена внешки: пластик и наклейки по сериям ---------- */
add(box(0.12, 2.5, 5.0, M.white, -9.88, 1.35, 1.0, 0.03));
[C.sky, C.flare, C.ridge, C.cobalt].forEach((col, i) => {
  const zc = -0.8 + i * 1.2;
  const mt = new THREE.MeshPhysicalMaterial({ color: col, roughness: 0.25, clearcoat: 1 });
  add(box(0.1, 0.55, 0.9, mt, -9.78, 2.05, zc, 0.06));                    // боковина
  add(box(0.1, 0.32, 0.75, mt, -9.78, 1.4, zc, 0.06));                    // крыло
  add(box(0.06, 0.28, 0.4, M.white, -9.76, 0.9, zc - 0.15, 0.03));        // табличка с номером
  add(box(0.04, 0.18, 0.18, M.graph, -9.74, 0.9, zc - 0.15, 0.02));
});
add(box(0.06, 0.04, 4.8, M.glow(C.flare, 3), -9.8, 2.62, 1.0));
add(box(1.6, 0.45, 0.5, M.white, -8.9, 0.225, 1.0, 0.08));               // скамья
/* ---------- ресепшн и кофе у входа ---------- */
add(box(4.2, 1.05, 0.75, M.white, 5.6, 0.525, 5.1, 0.06));
add(box(4.3, 0.05, 0.85, M.graph, 5.6, 1.07, 5.1, 0.02));
add(box(3.0, 0.06, 0.02, M.glow(C.flare, 2.5), 5.6, 0.75, 5.49));
for (const x of [4.2, 5.2, 6.2, 7.2]) { add(cyl(0.18, 0.04, M.graph, x, 0.78, 5.85, 32)); add(cyl(0.03, 0.76, M.steel, x, 0.38, 5.85, 12)); }
add(box(0.45, 0.5, 0.45, M.graph, 7.3, 1.35, 4.95, 0.04));

/* ---------- под антресолью слева: сервис за стеклом и тюнинг-бар ---------- */
// стеклянная перегородка сервиса
add(box(8.0, FL2 - 0.25, 0.05, M.frost, -6.0, (FL2 - 0.25) / 2, -3.3));
