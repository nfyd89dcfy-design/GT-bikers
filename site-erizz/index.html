    <title>GT – электробайки, тюнинг и экипировка</title>
    <style>
      /* Заставка 19.10: белый, плавно в темный, 1,1 с темного, затем мигание:
         белый 20 мс, черный 20 мс, белый 50 мс и снова темный.
         Только opacity: такие анимации идут в потоке композитора и не пропускают кадры, пока грузится скрипт. */
      #boot { position: fixed; inset: 0; z-index: 2147482000; pointer-events: none;
        background: radial-gradient(70% 60% at 32% 62%, #1d3f9c 0%, #0c1a45 38%, #04060c 72%, #000 100%); }
      #boot::before, #boot::after { content: ""; position: absolute; inset: 0; will-change: opacity; }
      #boot::before { background: #000; opacity: 0; animation: boot-black 1600ms linear forwards; }
      #boot::after { background: #fff; opacity: 1; animation: boot-white 1600ms linear forwards; }
      #boot.out { opacity: 0; transition: opacity .28s ease; }
      @keyframes boot-white {
        0% { opacity: 1; }
        25%, 93.74% { opacity: 0; }
        93.75%, 94.99% { opacity: 1; }
        95%, 96.24% { opacity: 0; }
        96.25%, 99.37% { opacity: 1; }
        99.38%, 100% { opacity: 0; }
      }
      @keyframes boot-black {
        0%, 94.99% { opacity: 0; }
        95%, 96.24% { opacity: 1; }
        96.25%, 100% { opacity: 0; }
      }
    </style>
  </head>
  <body>
    <div id="boot" aria-hidden="true"></div>
    <script>window.__gtBoot0 = performance.now(); setTimeout(function () { var b = document.getElementById("boot"); if (b && !b.dataset.go) b.remove(); }, 8000);</script>
