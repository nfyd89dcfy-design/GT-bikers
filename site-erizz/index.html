    <title>GT – электробайки, тюнинг и экипировка</title>
    <style>
      /* Заставка: синий экран, выдержка, потом страница дважды мигает и включается */
      #boot { position: fixed; inset: 0; z-index: 2147482000; pointer-events: none;
        background: radial-gradient(120% 90% at 50% 42%, #3a6ef0 0%, #2a5bd7 45%, #1b3f9e 100%); }
      #boot.go { animation: boot-flick .5s steps(1, end) var(--d, 0ms) forwards; }
      /* бам (белый), синий, бам (белый), страница */
      @keyframes boot-flick { 0% { background: #fff; } 25% { background: #2a5bd7; } 52% { background: #fff; } 78%, 100% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { #boot.go { animation: none; opacity: 0; transition: opacity .4s ease var(--d, 0ms); } }
    </style>
  </head>
  <body>
    <div id="boot" aria-hidden="true"></div>
    <script>window.__gtBoot0 = performance.now(); setTimeout(function () { var b = document.getElementById("boot"); if (b && !b.dataset.go) b.remove(); }, 6000);</script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
